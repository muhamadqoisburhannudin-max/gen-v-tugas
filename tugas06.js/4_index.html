<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let hari = 1;

switch (hari) {
    case 1:
        console.log("Senin");
        
    case 2:
        console.log("Selasa");
        break;
    case 3:
        console.log("Rabu");
        
    case 4:
        console.log("Kamis");
        
    case 5:
        console.log("Jumat");
        
    case 6:
        console.log("Sabtu");
        
    case 7:
        console.log("Minggu");
        
    default:
        console.log("Angka tidak valid!");
}
    </script>
</body>
</html>
