
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mengubah Nilai Variabel</title>
</head>
<body>

    <h1>Mengubah Nilai Ujian</h1>
    <p>Buka Console untuk melihat hasilnya.</p>

    <script>
        // 1. Membuat variabel nilai ujian
        let nilai = 70;

        // 2. Menampilkan nilai awal
        console.log("Nilai awal:", nilai);

        // 3. Mengubah nilai menjadi 85
        nilai = 85;

        // 4. Menampilkan nilai baru
        console.log("Nilai setelah diubah:", nilai);
    </script>

</body>
</html>
